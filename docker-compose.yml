
services:

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      CATALOG_URL: "http://catalog:5001"
      ORDER_URL: "http://order:5002"
    depends_on:
      catalog:
        condition: service_healthy
      order:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      CATALOG_DB_PATH: "/data/catalog.db"
    volumes:
      - catalog_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order:
    build:
      context: .
      dockerfile: order/Dockerfile
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"
      ORDER_DB_PATH: "/data/orders.db"
      CATALOG_URL: "http://catalog:5001"
    volumes:
      - order_data:/data
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5002/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  catalog_data:
  order_data:
